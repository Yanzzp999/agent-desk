<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentDesk</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">R</div>
          <div>
            <strong>Ralph</strong>
            <span class="nav-subtitle">Control Plane</span>
          </div>
        </div>
        <nav class="nav" aria-label="Primary">
          <button data-view="overview" class="active" type="button"><span>Overview</span><small>Health and activity</small></button>
          <button data-view="runs" type="button"><span>Runs</span><small>Workers and tasks</small></button>
          <button data-view="planner" type="button"><span>Planner</span><small>PRD jobs</small></button>
          <button data-view="artifacts" type="button"><span>Artifacts</span><small>Outputs</small></button>
          <button data-view="settings" type="button"><span>Settings</span><small>Paths and tools</small></button>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-meta">
            <p class="eyebrow project-path" id="project-root">Loading project</p>
            <h1 id="page-title">Overview</h1>
          </div>
          <div class="top-actions">
            <span class="connection" id="connection-state">Connecting</span>
            <button class="button" id="refresh-button" type="button">Refresh</button>
          </div>
        </header>
        <section id="app" class="content" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
