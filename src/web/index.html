<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentDesk</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">
            <img src="/assets/agentdesk-icon.png" alt="" aria-hidden="true">
          </div>
          <div>
            <strong>AgentDesk</strong>
            <span class="nav-subtitle">Project Orchestrator</span>
          </div>
        </div>
        <section id="sidebar-summary" class="sidebar-summary" aria-label="Current workspace"></section>
        <nav class="nav" aria-label="Primary">
          <button data-view="sessions" class="active" type="button"><span>Sessions</span><small>Project and run history</small></button>
          <button data-view="tasks" type="button"><span>Tasks</span><small>Generate and launch</small></button>
          <button data-view="overview" type="button"><span>Overview</span><small>Workspace health</small></button>
          <button data-view="settings" type="button"><span>Settings</span><small>Runtime and paths</small></button>
        </nav>
        <section class="sidebar-section" aria-label="Recent projects">
          <div class="sidebar-section-head">
            <span>Projects</span>
            <small>Recent workspaces</small>
          </div>
          <div id="sidebar-projects" class="sidebar-projects"></div>
        </section>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-meta">
            <p class="eyebrow" id="page-kicker">Loading workspace</p>
            <h1 id="page-title">Sessions</h1>
            <p class="project-path" id="project-root">Loading project</p>
          </div>
          <div class="top-actions">
            <span class="connection" id="connection-state">Connecting</span>
            <button class="button" id="refresh-button" type="button">Refresh</button>
          </div>
        </header>
        <section id="app" class="content" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
