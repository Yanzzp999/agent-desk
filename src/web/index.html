<!doctype html>
<html lang="en" data-theme="dark" data-locale="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentDesk</title>
    <script>
      (() => {
        try {
          const locale = localStorage.getItem("agentDesk.locale");
          const theme = localStorage.getItem("agentDesk.theme");
          if (locale === "zh" || locale === "en") {
            document.documentElement.dataset.locale = locale;
            document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
          }
          if (theme === "dark" || theme === "light") {
            document.documentElement.dataset.theme = theme;
          }
        } catch {
          // Preferences are applied again by app.js once it loads.
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">
            <img src="/assets/agentdesk-icon.png" alt="" aria-hidden="true">
          </div>
          <div>
            <strong>AgentDesk</strong>
            <span class="nav-subtitle" id="brand-subtitle">Project Orchestrator</span>
          </div>
        </div>
        <div class="sidebar-tools">
          <button class="sidebar-action" id="open-project-button" type="button">Open project</button>
        </div>
        <section class="sidebar-section sidebar-projects-section" aria-label="Projects">
          <div class="sidebar-section-head">
            <span id="sidebar-projects-label">Projects</span>
            <small id="sidebar-sessions-label">Sessions</small>
          </div>
          <div id="sidebar-projects" class="sidebar-projects"></div>
        </section>
        <div class="sidebar-footer">
          <button class="sidebar-view-button" data-sidebar-view="settings" type="button">
            <span id="settings-nav-label">Settings</span>
            <small id="settings-nav-subtitle">Runtime and paths</small>
          </button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-meta">
            <p class="eyebrow" id="page-kicker">Loading workspace</p>
            <h1 id="page-title">Sessions</h1>
            <p class="project-path" id="project-root">Loading project</p>
          </div>
          <div class="top-actions">
            <div class="preference-switches" aria-label="Display preferences">
              <button class="preference-toggle" id="locale-toggle" type="button">
                <span id="locale-toggle-label">中文</span>
              </button>
              <button class="preference-toggle" id="theme-toggle" type="button">
                <span id="theme-toggle-label">Light</span>
              </button>
            </div>
            <span class="connection" id="connection-state">Connecting</span>
            <button class="button" id="refresh-button" type="button">Refresh</button>
          </div>
        </header>
        <section id="app" class="content" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
